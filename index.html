<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Polyfill setter for window.fetch to allow extensions to hook fetch safely
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var _protoFetch = window.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _protoFetch;
              },
              set: function(fn) {
                _protoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }

        // Catch and prevent unhandled extension errors from bubbling
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('only a getter') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
